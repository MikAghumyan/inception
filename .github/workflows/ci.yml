name: Inception CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-dockerfiles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Lint Nginx Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ./srcs/requirements/nginx/Dockerfile
          failure-threshold: warning
      - name: Lint MariaDB Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ./srcs/requirements/mariadb/Dockerfile
          failure-threshold: warning
      - name: Lint WordPress Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ./srcs/requirements/wordpress/Dockerfile
          failure-threshold: warning
      - name: Lint Redis Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ./srcs/requirements/bonus/redis/Dockerfile
          failure-threshold: warning
      - name: Lint FTP Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ./srcs/requirements/bonus/ftp/Dockerfile
          failure-threshold: warning
      - name: Lint adminer Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ./srcs/requirements/bonus/adminer/Dockerfile
          failure-threshold: warning
      - name: Lint static_website Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ./srcs/requirements/bonus/static_website/Dockerfile
          failure-threshold: warning
      - name: Lint cAdvisor Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ./srcs/requirements/bonus/cAdvisor/Dockerfile
          failure-threshold: warning
  build:
    runs-on: ubuntu-latest
    needs: lint-dockerfiles
    steps:
      - uses: actions/checkout@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Copy secrets and env files
        run: |
          cp -r secrets.example secrets \
          && cp .env.example .env
      - name: Validate docker-compose.yml
        run: docker compose -f srcs/docker-compose.yml config -q
      - name: Build and push Docker images
        run: docker compose -f srcs/docker-compose.yml build
  integration-tests:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Copy secrets and env files
        run: |
          cp -r secrets.example secrets \
          && cp .env.example .env
      - name: Start services
        run: docker compose -f srcs/docker-compose.yml up -d
      - name: Wait for services to be ready
        run: |
          chmod +x .github/scripts/waiting_services.sh
          .github/scripts/waiting_services.sh
      - name: Run integration tests
        run: |
          chmod +x .github/scripts/integration_test.sh
          .github/scripts/integration_test.sh
      - name: Stop services
        if: always()
        run: docker compose -f srcs/docker-compose.yml down
